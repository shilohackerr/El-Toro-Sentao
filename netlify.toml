# ════════════════════════════════════════════════════════════
#  TORO SENTAO — Configuración Netlify
#  Este archivo le dice a Netlify cómo manejar el sitio
# ════════════════════════════════════════════════════════════

[build]
  publish = "."        # Carpeta raíz del proyecto

# Redireccionamiento general (SPA-ready para futuro)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Headers de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer-when-downgrade"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
